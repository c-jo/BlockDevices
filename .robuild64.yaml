%YAML 1.0
---

# RISC OS 64-bit module smoke test, executed on https://build.riscos.online/
# with `riscos-build-online -A aarch64`.
#
# The module itself is built by .github/workflows/ci.yml, inside the
# gerph/riscos-build container, using the local toolchain directly (the
# aarch64 execution guest has no compiler). This file only RMLoads and
# exercises the pre-built rm64/BlockDevices module - submit it alongside
# that file, not the source tree.

jobs:
  build:
    env:
      "Sys$Environment": ROBuild

    script:
      - echo
      - echo *** Load the module ***
      - RMLoad rm64.BlockDevices

      - echo *** Test BlockDevices command ***
      - BlockDevices
      - echo *** Killing the module should be safe ***
      - RMKill BlockDevices

      - echo
      - echo *** SUCCESS ***
